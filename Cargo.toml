[package]
name = "oboete"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1"
anyhow = "1.0.104"
# Local time for session start's timeline (claude-mem shows local time); already in the tree.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4"
httparse = "1"
percent-encoding = "2"
regex = "1"
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
ryu-js = "1.0.3"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
sqlite-vec = "0.1.9"
toml = "1.1.6"
tokio = { version = "1", features = ["rt", "io-std"] }
toml_edit = "0.23"
ureq = { version = "3.4.2", features = ["json"] }
zstd = "0.14"
unicode-normalization = "0.1.25"
# Milestone 4, Task 10's spike: bge-m3 in-process, ONNX Runtime linked in, no hf-hub.
fastembed = { version = "=7.1.1", optional = true, default-features = false, features = ["ort-load-dynamic"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic"] }

[features]
local-embed = ["dep:fastembed", "dep:ort"]

# A timed-out CLI is killed with its process group (provider::kill_tree); already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The file identity that keeps a store's device id (db::store_file); already in the tree.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }

[profile.release]
strip = true

[dev-dependencies]
# The commit hook of M2's crash harness (src/crash.rs), in test builds only.
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
tempfile = "3"
