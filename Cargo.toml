[package]
name = "oboete"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4"
httparse = "1"
percent-encoding = "2"
regex = "1"
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
sqlite-vec = "0.1.9"
toml = "1.1.6"
tokio = { version = "1", features = ["rt", "io-std"] }
toml_edit = "0.23"
ureq = { version = "3.4.2", features = ["json"] }
zstd = "0.14"
unicode-normalization = "0.1.25"

# A timed-out CLI is killed with its process group (provider::kill_tree); already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The file identity that keeps a store's device id (db::store_file); already in the tree.
[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3"
