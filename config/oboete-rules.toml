# Extra rules in gitleaks' schema for shapes the bundled gitleaks.toml lacks: the owner's
# providers' keys, and credentials by where they stand (a URI's password, a Cookie or
# Authorization header). Same evaluation: keywords gate the regex, first capture group is the secret.

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\b(gsk_[A-Za-z0-9]{40,64})\b'''
keywords = ["gsk_"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\b(sk-ant-[A-Za-z0-9_-]{40,200})\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\b(sk-or-v1-[a-f0-9]{48,96})\b'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "nvidia-nim-api-key"
description = "NVIDIA NIM / build.nvidia.com API key"
regex = '''\b(nvapi-[A-Za-z0-9_-]{40,120})\b'''
keywords = ["nvapi-"]

[[rules]]
id = "xai-api-key"
description = "xAI API key"
regex = '''\b(xai-[A-Za-z0-9]{40,120})\b'''
keywords = ["xai-"]

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''\b(tvly-[A-Za-z0-9_-]{20,80})\b'''
keywords = ["tvly-"]

[[rules]]
id = "generic-bearer-token"
description = "Bearer token in an Authorization header"
regex = '''(?i)\bbearer[ \t]+([A-Za-z0-9_\-.=+/]{20,})'''
keywords = ["bearer"]
entropy = 3.0

[[rules]]
id = "generic-basic-auth"
description = "Basic credentials in an Authorization header, with or without a curl before it"
regex = '''(?i)\bauthorization["']?\s*[:=]\s*["']?basic[ \t]+([A-Za-z0-9+/]{4,}={0,2})'''
keywords = ["basic"]
# No entropy gate: after "Authorization: Basic" even a weak credential is one.

[[rules]]
id = "secret-assignment"
description = "A value assigned to a name that says it is a secret (BOT_CHANNEL_SECRET=, \"client_secret\": , DB_PASSWORD=, MYSQL_PWD=), however plain: generic-api-key passes over one under 10 characters, of entropy 3.5 or below, or with a $ or ; in it (#541)"
regex = '''(?i)\b[a-z0-9_.-]*(?:secret|token|passw(?:or)?d|_pwd|api[_-]?key|private[_-]?key|access[_-]?key|credential)s?["']?\s*[:=](?:[ \t\r\n]*(?:"[ \t]*((?:[^"\\\s]|\\.)(?:[^"\\\r\n]|\\.)*?)[ \t]*"|'[ \t]*((?:[^'\\\s]|\\.)(?:[^'\\\r\n]|\\.)*?)[ \t]*')|(?:[ \t]*\r?\n[ \t]+|[ \t]*)["']?([^\s"'`\\<>;,(){}\[\]$](?:[^\s"'`\\]|\\[^\sA-Za-z0-9"'`\\]){6,}(?:[^\s"'`\\<>;,(){}\[\]$]|\\[^\sA-Za-z0-9"'`\\])))'''
keywords = ["secret", "token", "passw", "pwd", "key", "credential"]
# `_pwd` only as the end of a name (MYSQL_PWD, DB_PWD): `PWD` and `OLDPWD` hold a working directory.
# Between the `=` or `:` and a quoted value, spaces, tabs and line breaks (pretty-printed JSON puts
# it on the next line, indented or not); before an unquoted one, spaces and tabs, or a line break
# before an indented line (YAML's `password:` with its value below): never a blank a value already
# masked left (redact.rs `fixpoint`), nor an unindented next line, so an env file's next line or
# the next word is not taken for a value. The cookie and authorization rules take the same gap
# after their `:`, and the header rules (bearer, basic, authorization) spaces and tabs alone between
# a scheme and its value.
# A quoted value whole, up to its closing quote (an escaped quote kept inside, the spaces around
# it left as written), however short. An unquoted one runs to a space, a quote or backtick, or a
# backslash before a letter, a digit, a quote or a backslash (an escape in a flattened tool field);
# a shell's escape of a sign (`\!`, `\$`) is the value's. A bracket, `;`, `,` or `$` inside it is the
# value's, one at either end the code's (`max_output_tokens:10000}),`, `${API_KEY}`, a mask
# already there). It is taken from 8 characters, the shortest password most systems take: shorter,
# it is mostly a number or a type (`max_tokens: 4096`, `password: String`). No entropy gate and no
# allowlist: a weak password is plain, a passphrase letters only, a token dotted, and a default in
# use reads as a placeholder; a reference or a placeholder masked costs little.

[[rules]]
id = "uri-userinfo-password"
description = "Password in a URI's userinfo (postgres://user:pass@host); a user with no password is left"
regex = '''(?i)\b[a-z][a-z0-9+.-]{1,20}://[^\s:/?#@"'`]*:([^\s/?#@"'`]+)@'''
keywords = ["://"]
# No entropy gate: a connection string's password is often weak.

[[rules]]
id = "cookie-header"
description = "Cookies of a Cookie or Set-Cookie header, whatever they are named: name=value pairs split by ;, a value bare or quoted"
regex = '''(?i)\b(?:set-)?cookie["']?\s*[:=](?:[ \t\r\n]*["']|[ \t]*\r?\n[ \t]+|[ \t]*)([^\s;=,"']+=(?:"(?:[^"\\\r\n]|\\.)*"|[^\s;,"']*)(?:;\s*[^\s;=,"']+(?:=(?:"(?:[^"\\\r\n]|\\.)*"|[^\s;,"']*))?)*)'''
keywords = ["cookie"]

[[rules]]
id = "authorization-header"
description = "Credential in an Authorization header of any scheme, with or without a curl before it: a scheme's auth-params whole (Digest, AWS4-HMAC-SHA256), else one token (Token, ApiKey, none)"
regex = '''(?i)\b(?:proxy-)?authorization["']?\s*[:=](?:[ \t\r\n]*["']|[ \t]*\r?\n[ \t]+|[ \t]*)(?:[a-z0-9!#$%&*+.^_`|~-]{2,31}[ \t]+([a-z0-9_-]+\s*=\s*(?:"(?:[^"\\\r\n]|\\.)*"|[^\s,"']+)(?:\s*,\s*[a-z0-9_-]+\s*=\s*(?:"(?:[^"\\\r\n]|\\.)*"|[^\s,"']+))*)|(?:[a-z0-9!#$%&*+.^_`|~-]{2,31}[ \t]+)?([A-Za-z0-9_\-.=+/:~]{8,}))'''
keywords = ["authorization"]
entropy = 3.0

[[rules]]
id = "cli-flag-secret"
description = "A value given after a space to a command-line flag that names a secret (--auth-token VALUE, --client-secret 'VALUE'); after `=` it is secret-assignment's"
regex = '''(?i)(?:^|[\s"'])--(?:[a-z0-9]+[-_])*(?:secret|token|passw(?:or)?d|api[_-]?key|private[_-]?key|access[_-]?key|credential)[ \t]+(?:"[ \t]*((?:[^"\\\s]|\\.)(?:[^"\\\r\n]|\\.)*?)[ \t]*"|'[ \t]*((?:[^'\\\s]|\\.)(?:[^'\\\r\n]|\\.)*?)[ \t]*'|([^\s"'`\\<>;,(){}\[\]$-](?:[^\s"'`\\]|\\[^\sA-Za-z0-9"'`\\]){6,}(?:[^\s"'`\\<>;,(){}\[\]$]|\\[^\sA-Za-z0-9"'`\\])))'''
keywords = ["secret", "token", "passw", "key", "credential"]
# As secret-assignment: a quoted value whole, an unquoted one from 8 characters (shorter is mostly a
# number, `--max-token 4096`), a shell's escape of a sign inside it; a value that starts with `-` is
# the next flag.
[[rules.allowlists]]
# A number given to a flag that counts tokens is a count (`--max-token 12345678`,
# `--num-output-token 512000`); a token's own flag (`--token`, `--auth-token`) and a password's
# keep a value of digits masked.
regexTarget = "match"
regexes = ['''(?i)--(?:max|min|num)[-_](?:[a-z0-9]+[-_])*token[ \t]+["']?[0-9]+["']?$''']

[[rules]]
id = "curl-user"
description = "The user:password given to curl's -u / --user or -U / --proxy-user, as one word of a shell: whatever follows it, of any characters, the option alone or last in a cluster of short ones (-su)"
regex = '''(?:(?:^|[ \t\n\r])(?:-[A-Za-z0-9#]*?[uU]|--(?:proxy-)?user)(?:=|[ \t]{1,5})(?:((?:"(?:[^"\\\r\n]|\\[^nr]){3,}"|'(?:[^'\\\r\n]|\\[^nr]){3,}'|[\w$@.-]+(?:[+\\]+[\w$@.-]+)*)?:(?:"(?:[^"\\\s,:;+.)}\]]|\\[^nr])(?:[^"\\\r\n]|\\[^nr]){2,}"(?-u:\b{end-half})|'(?:[^'\\\s,:;+.)}\]]|\\[^nr])(?:[^'\\\r\n]|\\[^nr]){2,}'(?-u:\b{end-half})|<[^<>\s]{1,60}>|(?:[^\s"'\x60\\|&;()<>]|\\[^\s\\"'nrt])+)|"(?:(?:(?:[^:"\\\r\n]|\\[^nr]){3,})?:(?:[^"\\\s,:;+.)}\]]|\\[^nr])(?:[^"\\\r\n]|\\[^nr]){2,}|(?:[^:"\\\r\n]|\\[^nr]){3,}:)"(?-u:\b{end-half})|'(?:(?:(?:[^:'\\\r\n]|\\[^nr]){3,})?:(?:[^'\\\s,:;+.)}\]]|\\[^nr])(?:[^'\\\r\n]|\\[^nr]){2,}|(?:[^:'\\\r\n]|\\[^nr]){3,}:)'(?-u:\b{end-half})|[\w$@.-]*[0-9][\w$@.-]*:)|\\+"((?:[^:"\\\r\n]{3,})?:[^"\\\s,:;+.)}\]][^"\\\r\n]{2,}|[^:"\\\r\n]{3,}:)\\+"(?-u:\b{end-half}))|[ \t]-[A-Za-z0-9#]*?[uU](?:((?:[\w$@.-]+(?:[+\\]+[\w$@.-]+)*)?:(?:<[^<>\s]{1,60}>|(?:[^\s"'\x60\\|&;()<>]|\\[^\s\\"'nrt])+)|"(?:[^:"'\s,\\]{3,})?:[^"'\s,\\]{3,}"(?-u:\b{end-half})|'(?:[^:"'\s,\\]{3,})?:[^"'\s,\\]{3,}'(?-u:\b{end-half}))|\\+"((?:[^:"'\s,\\]{3,})?:[^"'\s,\\]{3,})\\+"(?-u:\b{end-half})))'''
keywords = ["curl"]
entropy = 2
# gitleaks' curl-auth-user (kept as it is) takes an unquoted value only of word characters, only
# before white space or the text's end, only after `-u` or `--user`, and passes over every password
# that starts with one of its placeholders (#985). This rule reads the option's value where it
# stands, in a text that names curl: each value of the text, left to right, with no run from the
# word curl to it, and the pattern ends on the value. In this order: user:password with each part
# quoted or not (the user may be empty); a value quoted whole, in quotes or in escaped ones (a
# flattened field, a JSON text inside one); a key that holds a digit, with no password. A part in
# quotes is at least three characters, as gitleaks has it, and ends on its line. A password in
# quotes does not start with white space, `,`, `:`, `;`, `+`, `.`, `)`, `}` or `]`: those follow the
# quote that closes a string, in a JSON text (`"curl -u admin:",  "next"`) and in code
# (`run("curl -u admin:"); h("next")`), and `key: value` in quotes after another tool's option
# is no credential. The quote that closes a value has no ASCII word character after it: where
# one follows, the quote closed a string before the next one opened. Right after a short option
# (`-uadmin:<pw>`) a value is read only where a blank stands before the option (at a line's
# start a `-` and a word are a removed line of a diff), it has a password, and in quotes it
# holds no white space, quote or comma: a quote there mostly closes a string around a command
# that ends on the option (`bash -c 'date -u'`). An unquoted password runs to white space, a
# quote, a backquote, `|&;()<>` or a backslash that escapes one of them. What it passes over is
# in its own allowlist, each entry from the value's start: a placeholder, a variable or a
# template to the value's end, a URL, a format of date and the Japanese placeholder by how they
# start (so `-U https://<password>`, a user named `https`, is passed over as a URL).
[[rules.allowlists]]
regexes = [
    # a placeholder for the password, whole (gitleaks matches these anywhere in the value); a full
    # stop or a comma of the sentence may follow it
    '''^["']?[^:]*["']?:["']?(?:change(?:it|me)|pass(?:word)?|pwd|test|token|\*+|x+|\.+)["']?[.,]?$''',
    '''^["']?(?:<[^>]+>|[^:<]*)["']?:["']?<[^>]+>["']?[.,]?$|^["']?<[^:>]+:[^>]+>["']?[.,]?$''',
    '''^["']?[^:]*:\[[^\]]+\]["']?[.,]?$''',
    # a variable, a command or a template for the password; for the user where no password follows
    '''^["']?(?:\$+(?:\w+|\{[^}]*\}|\([^)]*\))|\$?\{\{[^}]*\}\}|[^:$])*["']?:["']?(?:\$+(?:\w+|\{[^}]*\}|\([^)]*\))|\$?\{\{[^}]*\}\})+["']?[.,]?$''',
    '''^["']?(?:\$+(?:\w+|\{[^}]*\}|\([^)]*\))|\$?\{\{[^}]*\}\}|<[^>]+>)+["']?:["']?$''',
    # another tool's -u: a URL, a format of date
    '''^["']?(?:https?|rediss?)://''',
    '''^["']?\+[^:]*%''',
    # the placeholder as sessions in Japanese write it (`-u ユーザー名:パスワード`)
    '''^["']?[^:]*["']?:["']?パスワード''',
]

[[rules]]
id = "slack-token"
description = "A Slack token of any length and kind (xoxb-, xoxp-, xoxe-, xoxc-, xoxd- and the rest, xapp-), as claude-mem 15.5 masks one and its client and cookie tokens too: gitleaks' rules take a refresh token only at 146 characters after xoxe-1-, and neither takes xoxc- or xoxd-"
regex = '''(?i)\b((?:xox[a-z]|xapp)-[a-z0-9%/+=-]{10,})'''
keywords = ["xox", "xapp-"]
# A cookie token (`xoxd-`) holds `/`, `+` and `=`, or `%2F`, `%2B` and `%3D` once URL-encoded.

[[rules]]
id = "slack-webhook-secret"
description = "The secret of a Slack incoming, workflow or trigger webhook URL, whole: gitleaks' rule stops 56 characters into the path"
regex = '''(?i)\bhooks\.slack\.com/(?:services|workflows|triggers)/t[a-z0-9]+/[a-z0-9]+/(?:[0-9]+/)?([a-z0-9+]{20,})'''
keywords = ["hooks.slack.com"]

[[rules]]
id = "microsoft-teams-webhook-secret"
description = "The path of a Microsoft Teams incoming webhook URL, whole: gitleaks' rule names no group for the secret, so its first group, a repeat inside the first GUID, was masked (five characters) and the rest of the URL kept"
regex = '''(?i)\b[a-z0-9-]+\.webhook\.office\.com/webhookb2/((?:[a-z0-9*-]|\[REDACTED\])+@[a-z0-9]{8}-(?:[a-z0-9]{4}-){3}[a-z0-9]{12}/IncomingWebhook/[a-z0-9]{32}/[a-z0-9]{8}-(?:[a-z0-9]{4}-){3}[a-z0-9]{12}(?:/[a-z0-9_-]+)*)'''
keywords = ["webhook.office.com"]
# The first GUID may hold masks or a tombstone's stars: that is how a record stored under gitleaks'
# rule alone reads (`…-[REDACTED][REDACTED]@…`), and a rescan has to find the rest of its path.

[[rules]]
id = "workflow-trigger-signature"
description = "The signature of an Azure Logic Apps or Power Automate HTTP trigger URL, which a Teams workflow webhook is (they replace the incoming webhooks above): the `sig` parameter is the URL's only credential, and gitleaks has no rule for it"
regex = '''(?i)/workflows/[0-9a-f]{32}/triggers/[^\s"'`<>]+?[?&](?:amp;)?sig=([a-z0-9_%+/=-]{20,})'''
entropy = 3
keywords = ["/triggers/"]
# Both hosts: `prod-NN.<region>.logic.azure.com` and `<environment>.environment.api.powerplatform.com`
# have `/workflows/<32 hex>/triggers/` in the path. A placeholder (`sig=XXXX…`) is below the entropy.

[[rules]]
id = "azure-sas-signature"
description = "The signature of an Azure Storage shared access signature: a URL's query, or a token, with `sv=` (the service version, a date) and `sig=`, whichever comes first (#931)"
regex = '''(?i)\bsv=\d{4}-\d{2}-\d{2}(?:&(?:amp;)?[a-z][a-z0-9_-]{0,24}=[^\s"'`<>&;]*)*?&(?:amp;)?sig=([a-z0-9%+/=_-]{20,})|\bsig=([a-z0-9%+/=_-]{20,})(?:&(?:amp;)?[a-z][a-z0-9_-]{0,24}=[^\s"'`<>&;]*)*?&(?:amp;)?sv=\d{4}-\d{2}-\d{2}'''
entropy = 3
keywords = ["sig="]
# The parameters between the two are the same query's or token's (`ss`, `srt`, `sp`, `se`, `st`,
# `spr`, `sr`, `sip`, `skoid`, a request's `api-version`), joined by `&` or by `&amp;` as HTML writes it. A `sig`
# beside no such `sv` is another URL's (the rule above takes a workflow trigger's), and a short one
# or a placeholder is none.

[[rules]]
id = "jwt-base64-whole"
description = "A Base64-encoded JSON Web Token, whole: gitleaks' rule names its header markers as groups, so the marker that took part was masked (ten characters), masked-remainder took the rest of its line, and a token wrapped over lines kept every line after the first"
regex = '''\b(?:(ZXlK(?:aGJHY2lPaU|aGNIVWlPaU|aGNIWWlPaU|aGRXUWlPaU|aU5qUWlP|amNtbDBJanBi|amRIa2lPaU|bGNHc2lPbn|bGJtTWlPaU|cWEzVWlPaU|cWQyc2lPb|cGMzTWlPaU|cGRpSTZJ|cmFXUWlP|clpYbGZiM0J6SWpwY|cmRIa2lPaUp|dWIyNWpaU0k2|d01tTWlP|d01uTWlPaU|d2NIUWlPaU|emRXSWlPaU|emRuUWlP|MFlXY2lPaU|MGVYQWlPaUp|MWNtd2l|MWMyVWlPaUp|MlpYSWlPaU|MlpYSnphVzl1SWpv|NElqb2|NE5XTWlP|NE5YUWlPaU|NE5YUWpVekkxTmlJNkl|NE5YVWlPaU|NmFYQWlPaU)[A-Za-z0-9+/_-]{40,}(?:\r?\n[A-Za-z0-9+/]{60,80})+(?:\r?\n[A-Za-z0-9+/]{1,80})?={0,2})(?:\r?\n|["'`]|$)|(ZXlK(?:aGJHY2lPaU|aGNIVWlPaU|aGNIWWlPaU|aGRXUWlPaU|aU5qUWlP|amNtbDBJanBi|amRIa2lPaU|bGNHc2lPbn|bGJtTWlPaU|cWEzVWlPaU|cWQyc2lPb|cGMzTWlPaU|cGRpSTZJ|cmFXUWlP|clpYbGZiM0J6SWpwY|cmRIa2lPaUp|dWIyNWpaU0k2|d01tTWlP|d01uTWlPaU|d2NIUWlPaU|emRXSWlPaU|emRuUWlP|MFlXY2lPaU|MGVYQWlPaUp|MWNtd2l|MWMyVWlPaUp|MlpYSWlPaU|MlpYSnphVzl1SWpv|NElqb2|NE5XTWlP|NE5YUWlPaU|NE5YUWpVekkxTmlJNkl|NE5YVWlPaU|NmFYQWlPaU)[A-Za-z0-9+/_-]{40,}={0,2})|ZXlK\[REDACTED\](?:\[REDACTED\]|\*+)?((?:\r?\n[A-Za-z0-9+/]{60,80})+(?:\r?\n[A-Za-z0-9+/]{1,80})?={0,2})(?:\r?\n|["'`]|$))'''
entropy = 2
keywords = ["zxlk"]
# Three forms, the wrapped one first. Wrapped: the first line, then lines of 60 to 80 Base64 characters
# (64 and 76 are the common widths), then at most one shorter last line, and then the line's end or
# a closing quote, which is matched outside the group: so the line after a token is not taken for
# its last line unless it is a bare word alone on its line after a token that ended a full line.
# On one line: gitleaks' pattern without its line breaks and backslash, so the token ends with its
# line. A last line that other text follows on the same line is left.
# Last, what a record stored under gitleaks' rule alone holds of a wrapped token: its head masked
# (`ZXlK[REDACTED]`, then the mask or the stars of the line's rest) and the lines after it, which a
# rescan has to find. The head stays as it is; the lines after it are the secret.

[[rules]]
id = "private-key-lines"
description = "The lines of a private key block that is not whole: gitleaks' rule needs a block's header and its footer, so the head of a key file, its tail, or a paste short of its last line was stored as typed (#938)"
regex = '''(?i)(?:-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----(?:\\[rn]|\s)+(?:[A-Za-z-]{2,30}: [^\r\n\\]{0,200}(?:\\[rn]|\s)+){0,6}([A-Za-z0-9+/=]{16,}(?:(?:\\[rn]|\s)+[A-Za-z0-9+/=]{16,})*(?:(?:\\[rn]|\s)+[A-Za-z0-9+/=]{1,15})?)(?:\\[rn]|[\r\n]|["'`]|$)|(?:^|\\[rn]|[^A-Za-z0-9+/=\\])([A-Za-z0-9+/=]{16,}(?:(?:\\[rn]|\s)+[A-Za-z0-9+/=]{16,})*(?:(?:\\[rn]|\s)+[A-Za-z0-9+/=]{1,15})?)(?:\\[rn]|\s)+-----END[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----)'''
entropy = 3.5
keywords = ["private key"]
# Two forms. After a header: the block's lines of Base64, 16 characters or more each and at most one
# shorter last line alone on its line, with an encrypted key's own lines (`Proc-Type:`, `DEK-Info:`,
# at most six) left between the header and them. Before a footer: the same lines, from the text's
# start, a line break, or a character that is neither Base64 nor a backslash (never from the `n` of
# a line break written out, which would leave half an escape when the range is starred). A line break is one as typed or as a tool's output holds it, written out (`\n`). The header and the footer stay,
# as do the lines of a certificate or a public key, a header or a footer quoted with no Base64 beside
# it, and a placeholder's lines (the entropy). A whole block is gitleaks' rule's, as before; one with
# no footer before a whole one, which that rule takes from the first header to the second, has both
# blocks' lines masked here.

[[rules]]
id = "masked-remainder"
description = "What is glued to a mask already there, right after it or after the quote that closed the masked value: the end of a secret a rule stopped short of, as gitleaks' slack-webhook-url left the end of a workflow webhook's secret after 56 characters of its path (which a rescan finds no other way, the host being masked), or a shell's word that goes on after a quoted value ('abc'def is one argument)"
regex = '''\[REDACTED\](?:([A-Za-z0-9+]{4,})|["']([A-Za-z0-9_+-][^\s"'`\\<>;,(){}\[\]$|&]{3,})|/([A-Za-z0-9+]{16,}))|["'][ \t]+\[REDACTED\][ \t]+["']([A-Za-z0-9_+-][^\s"'`\\<>;,(){}\[\]$|&]{3,})'''
keywords = ["[redacted]"]
# After the quote that closed a masked value, the rest of the shell's word (`'abc'_def`, `'abc'-x.y`)
# from a letter, a digit, `_`, `+` or `-`, up to a space, a quote or a sign the shell reads; so a
# method after a string (`'[REDACTED]'.strip()`) is left. A quoted value's mask with the spaces its
# quotes held around it (`' abc 'def`) counts as glued to its closing quote; a mask, a space and
# then a quoted argument (`--token [REDACTED] "https…"`) does not. Glued right after the mask, letters,
# digits and `+`, as slack-webhook-secret takes them. After a `/` (gitleaks'
# rule can stop right before the one in front of the secret) only a run as long as a secret: a
# shorter one is mostly a path's (`/keys/[REDACTED]/rotate`). A mask followed by a space, another
# sign or the end is left; one to three characters of a secret's end tell nothing of it. Each scan
# runs to a fixpoint over what it masked, so this takes such an end in a new capture too.

[[rules]]
id = "discord-webhook-token"
description = "The token of a Discord webhook URL (discord.com, discordapp.com and their ptb and canary hosts)"
regex = '''(?i)\b(?:(?:ptb|canary)\.)?discord(?:app)?\.com/api/(?:v\d+/)?webhooks/[0-9]{17,20}/([a-z0-9_-]{60,})'''
keywords = ["discord"]

[[rules]]
id = "stripe-webhook-secret"
description = "A Stripe webhook signing secret"
regex = '''\b(whsec_[A-Za-z0-9]{32,})'''
keywords = ["whsec_"]

[[rules]]
id = "dockerhub-pat"
description = "A Docker Hub personal access token"
regex = '''\b(dckr_pat_[A-Za-z0-9_-]{27,})'''
keywords = ["dckr_pat_"]

[[rules]]
id = "pypi-token"
description = "A PyPI API token of pypi.org or test.pypi.org: gitleaks' rule takes pypi.org's alone"
regex = '''\b(pypi-AgE[A-Za-z0-9_-]{50,})'''
keywords = ["pypi-"]

# claude-mem 15.10's shapes the bundled gitleaks.toml lacks (its src/utils/redaction.ts).

[[rules]]
id = "google-oauth-access-token"
description = "A Google OAuth 2.0 access token, the GCE metadata server's ya29.c. form too"
regex = '''\b(ya29\.(?:c\.)?[0-9A-Za-z_-]{20,})'''
keywords = ["ya29."]

[[rules]]
id = "runcrate-api-key"
description = "A Runcrate API key"
regex = '''\b(rc_live_[A-Za-z0-9_-]{24,})'''
keywords = ["rc_live_"]

[[rules]]
id = "supabase-access-token"
description = "A Supabase personal access token (what supabase login stores)"
regex = '''\b(sbp_[a-f0-9]{40})\b'''
keywords = ["sbp_"]

[[rules]]
id = "notion-integration-token"
description = "A Notion integration token: ntn_ and 46 characters of any kind, or the older secret_ and 43"
regex = '''\b(ntn_[A-Za-z0-9]{46}|secret_[A-Za-z0-9]{43})\b'''
keywords = ["ntn_", "secret_"]

[[rules]]
id = "sentry-org-auth-token"
description = "A Sentry organization auth token of any payload: gitleaks' rule asks for the payload's own start"
regex = '''\b(sntrys_[A-Za-z0-9+/]{20,}={0,2}_[A-Za-z0-9+/]{43})(?:[^A-Za-z0-9+/_]|$)'''
keywords = ["sntrys_"]
