# Extra rules in gitleaks' schema for shapes the bundled gitleaks.toml lacks: the owner's
# providers' keys, and credentials by where they stand (a URI's password, a Cookie or
# Authorization header). Same evaluation: keywords gate the regex, first capture group is the secret.

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\b(gsk_[A-Za-z0-9]{40,64})\b'''
keywords = ["gsk_"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\b(sk-ant-[A-Za-z0-9_-]{40,200})\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\b(sk-or-v1-[a-f0-9]{48,96})\b'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "nvidia-nim-api-key"
description = "NVIDIA NIM / build.nvidia.com API key"
regex = '''\b(nvapi-[A-Za-z0-9_-]{40,120})\b'''
keywords = ["nvapi-"]

[[rules]]
id = "xai-api-key"
description = "xAI API key"
regex = '''\b(xai-[A-Za-z0-9]{40,120})\b'''
keywords = ["xai-"]

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''\b(tvly-[A-Za-z0-9_-]{20,80})\b'''
keywords = ["tvly-"]

[[rules]]
id = "generic-bearer-token"
description = "Bearer token in an Authorization header"
regex = '''(?i)\bbearer\s+([A-Za-z0-9_\-.=+/]{20,})'''
keywords = ["bearer"]
entropy = 3.0

[[rules]]
id = "generic-basic-auth"
description = "Basic credentials in an Authorization header, with or without a curl before it"
regex = '''(?i)\bauthorization["']?\s*[:=]\s*["']?basic\s+([A-Za-z0-9+/]{4,}={0,2})'''
keywords = ["basic"]
# No entropy gate: after "Authorization: Basic" even a weak credential is one.

[[rules]]
id = "secret-assignment"
description = "A value assigned to a name that says it is a secret (BOT_CHANNEL_SECRET=, \"client_secret\": , DB_PASSWORD=), however plain: generic-api-key passes over one whose entropy is 3.5 or below (#541)"
regex = '''(?i)\b[a-z0-9_.-]*(?:secret|token|passw(?:or)?d|api[_-]?key|private[_-]?key|access[_-]?key|credential)s?["']?\s*[:=]\s*["']?([^\s"'`<>;,(){}\[\]$\\]{16,})'''
keywords = ["secret", "token", "passw", "key", "credential"]
entropy = 2.0
# As generic-api-key's own: a value of letters only names something (process.env.SECRET), and a
# placeholder says it is one.
[[rules.allowlists]]
regexes = ['''^[a-zA-Z_.-]+$''']
stopwords = ["example", "sample", "placeholder", "dummy", "changeme", "xxxx"]

[[rules]]
id = "uri-userinfo-password"
description = "Password in a URI's userinfo (postgres://user:pass@host); a user with no password is left"
regex = '''(?i)\b[a-z][a-z0-9+.-]{1,20}://[^\s:/?#@"'`]*:([^\s/?#@"'`]+)@'''
keywords = ["://"]
# No entropy gate: a connection string's password is often weak.

[[rules]]
id = "cookie-header"
description = "Cookies of a Cookie or Set-Cookie header, whatever they are named: name=value pairs split by ;, a value bare or quoted"
regex = '''(?i)\b(?:set-)?cookie["']?\s*[:=]\s*["']?([^\s;=,"']+=(?:"(?:[^"\\\r\n]|\\.)*"|[^\s;,"']*)(?:;\s*[^\s;=,"']+(?:=(?:"(?:[^"\\\r\n]|\\.)*"|[^\s;,"']*))?)*)'''
keywords = ["cookie"]

[[rules]]
id = "authorization-header"
description = "Credential in an Authorization header of any scheme, with or without a curl before it: a scheme's auth-params whole (Digest, AWS4-HMAC-SHA256), else one token (Token, ApiKey, none)"
regex = '''(?i)\b(?:proxy-)?authorization["']?\s*[:=]\s*["']?(?:[a-z0-9!#$%&*+.^_`|~-]{2,31}\s+([a-z0-9_-]+\s*=\s*(?:"(?:[^"\\\r\n]|\\.)*"|[^\s,"']+)(?:\s*,\s*[a-z0-9_-]+\s*=\s*(?:"(?:[^"\\\r\n]|\\.)*"|[^\s,"']+))*)|(?:[a-z0-9!#$%&*+.^_`|~-]{2,31}\s+)?([A-Za-z0-9_\-.=+/:~]{8,}))'''
keywords = ["authorization"]
entropy = 3.0
