# Extra rules in gitleaks' schema for shapes the bundled gitleaks.toml lacks: the owner's
# providers' keys, and credentials by where they stand (a URI's password, a Cookie or
# Authorization header). Same evaluation: keywords gate the regex, first capture group is the secret.

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\b(gsk_[A-Za-z0-9]{40,64})\b'''
keywords = ["gsk_"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\b(sk-ant-[A-Za-z0-9_-]{40,200})\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\b(sk-or-v1-[a-f0-9]{48,96})\b'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "nvidia-nim-api-key"
description = "NVIDIA NIM / build.nvidia.com API key"
regex = '''\b(nvapi-[A-Za-z0-9_-]{40,120})\b'''
keywords = ["nvapi-"]

[[rules]]
id = "xai-api-key"
description = "xAI API key"
regex = '''\b(xai-[A-Za-z0-9]{40,120})\b'''
keywords = ["xai-"]

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''\b(tvly-[A-Za-z0-9_-]{20,80})\b'''
keywords = ["tvly-"]

[[rules]]
id = "generic-bearer-token"
description = "Bearer token in an Authorization header"
regex = '''(?i)\bbearer\s+([A-Za-z0-9_\-.=+/]{20,})'''
keywords = ["bearer"]
entropy = 3.0

[[rules]]
id = "generic-basic-auth"
description = "Basic credentials in an Authorization header, with or without a curl before it"
regex = '''(?i)\bauthorization["']?\s*[:=]\s*["']?basic\s+([A-Za-z0-9+/]{4,}={0,2})'''
keywords = ["basic"]
# No entropy gate: after "Authorization: Basic" even a weak credential is one.

[[rules]]
id = "secret-assignment"
description = "A value assigned to a name that says it is a secret (BOT_CHANNEL_SECRET=, \"client_secret\": , DB_PASSWORD=, MYSQL_PWD=), however plain: generic-api-key passes over one under 10 characters, of entropy 3.5 or below, or with a $ or ; in it (#541)"
regex = '''(?i)\b[a-z0-9_.-]*(?:secret|token|passw(?:or)?d|_pwd|api[_-]?key|private[_-]?key|access[_-]?key|credential)s?["']?\s*[:=]\s*(?:"[ \t]*((?:[^"\\\s]|\\.)(?:[^"\\\r\n]|\\.)*?)[ \t]*"|'[ \t]*((?:[^'\\\s]|\\.)(?:[^'\\\r\n]|\\.)*?)[ \t]*'|["']?([^\s"'`\\<>;,(){}\[\]$][^\s"'`\\]{6,}[^\s"'`\\<>;,(){}\[\]$]))'''
keywords = ["secret", "token", "passw", "pwd", "key", "credential"]
# `_pwd` only as the end of a name (MYSQL_PWD, DB_PWD): `PWD` and `OLDPWD` hold a working directory.
# A quoted value whole, up to its closing quote (an escaped quote kept inside, the spaces around
# it left as written), however short. An unquoted one runs to a space, a quote or backtick, or a
# backslash (an escape in a flattened tool field): a bracket, `;`, `,` or `$` inside it is the
# value's, one at either end the code's (`max_output_tokens:10000}),`, `${API_KEY}`, a mask
# already there). It is taken from 8 characters, the shortest password most systems take: shorter,
# it is mostly a number or a type (`max_tokens: 4096`, `password: String`). No entropy gate and no
# allowlist: a weak password is plain, a passphrase letters only, a token dotted, and a default in
# use reads as a placeholder; a reference or a placeholder masked costs little.

[[rules]]
id = "uri-userinfo-password"
description = "Password in a URI's userinfo (postgres://user:pass@host); a user with no password is left"
regex = '''(?i)\b[a-z][a-z0-9+.-]{1,20}://[^\s:/?#@"'`]*:([^\s/?#@"'`]+)@'''
keywords = ["://"]
# No entropy gate: a connection string's password is often weak.

[[rules]]
id = "cookie-header"
description = "Cookies of a Cookie or Set-Cookie header, whatever they are named: name=value pairs split by ;, a value bare or quoted"
regex = '''(?i)\b(?:set-)?cookie["']?\s*[:=]\s*["']?([^\s;=,"']+=(?:"(?:[^"\\\r\n]|\\.)*"|[^\s;,"']*)(?:;\s*[^\s;=,"']+(?:=(?:"(?:[^"\\\r\n]|\\.)*"|[^\s;,"']*))?)*)'''
keywords = ["cookie"]

[[rules]]
id = "authorization-header"
description = "Credential in an Authorization header of any scheme, with or without a curl before it: a scheme's auth-params whole (Digest, AWS4-HMAC-SHA256), else one token (Token, ApiKey, none)"
regex = '''(?i)\b(?:proxy-)?authorization["']?\s*[:=]\s*["']?(?:[a-z0-9!#$%&*+.^_`|~-]{2,31}\s+([a-z0-9_-]+\s*=\s*(?:"(?:[^"\\\r\n]|\\.)*"|[^\s,"']+)(?:\s*,\s*[a-z0-9_-]+\s*=\s*(?:"(?:[^"\\\r\n]|\\.)*"|[^\s,"']+))*)|(?:[a-z0-9!#$%&*+.^_`|~-]{2,31}\s+)?([A-Za-z0-9_\-.=+/:~]{8,}))'''
keywords = ["authorization"]
entropy = 3.0

[[rules]]
id = "cli-flag-secret"
description = "A value given after a space to a command-line flag that names a secret (--auth-token VALUE, --client-secret 'VALUE'); after `=` it is secret-assignment's"
regex = '''(?i)(?:^|[\s"'])--(?:[a-z0-9]+[-_])*(?:secret|token|passw(?:or)?d|api[_-]?key|private[_-]?key|access[_-]?key|credential)[ \t]+(?:"[ \t]*((?:[^"\\\s]|\\.)(?:[^"\\\r\n]|\\.)*?)[ \t]*"|'[ \t]*((?:[^'\\\s]|\\.)(?:[^'\\\r\n]|\\.)*?)[ \t]*'|([^\s"'`\\<>;,(){}\[\]$-][^\s"'`\\]{6,}[^\s"'`\\<>;,(){}\[\]$]))'''
keywords = ["secret", "token", "passw", "key", "credential"]
# As secret-assignment: a quoted value whole, an unquoted one from 8 characters (shorter is mostly a
# number, `--max-token 4096`); a value that starts with `-` is the next flag.

[[rules]]
id = "slack-token"
description = "A Slack token of any length (xoxb-, xoxp-, xoxe- and the rest, xapp-), as claude-mem 15.5 masks one: gitleaks' rules take a refresh token only at 146 characters after xoxe-1-"
regex = '''(?i)\b((?:xox[abeprs]|xapp)-[a-z0-9-]{10,})'''
keywords = ["xox", "xapp-"]

[[rules]]
id = "slack-webhook-secret"
description = "The secret of a Slack incoming, workflow or trigger webhook URL, whole: gitleaks' rule stops 56 characters into the path"
regex = '''(?i)\bhooks\.slack\.com/(?:services|workflows|triggers)/t[a-z0-9]+/[a-z0-9]+/(?:[0-9]+/)?([a-z0-9]{20,})'''
keywords = ["hooks.slack.com"]

[[rules]]
id = "discord-webhook-token"
description = "The token of a Discord webhook URL (discord.com, discordapp.com and their ptb and canary hosts)"
regex = '''(?i)\b(?:(?:ptb|canary)\.)?discord(?:app)?\.com/api/(?:v\d+/)?webhooks/[0-9]{17,20}/([a-z0-9_-]{60,})'''
keywords = ["discord"]

[[rules]]
id = "stripe-webhook-secret"
description = "A Stripe webhook signing secret"
regex = '''\b(whsec_[A-Za-z0-9]{32,})'''
keywords = ["whsec_"]

[[rules]]
id = "dockerhub-pat"
description = "A Docker Hub personal access token"
regex = '''\b(dckr_pat_[A-Za-z0-9_-]{27,})'''
keywords = ["dckr_pat_"]

[[rules]]
id = "pypi-token"
description = "A PyPI API token of pypi.org or test.pypi.org: gitleaks' rule takes pypi.org's alone"
regex = '''\b(pypi-AgE[A-Za-z0-9_-]{50,})'''
keywords = ["pypi-"]
