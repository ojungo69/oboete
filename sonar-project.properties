sonar.organization=ojungo69
sonar.projectKey=ojungo69_oboete
sonar.projectName=oboete

# Rust, plus the bundled viewer page. A module's unit tests are a file of their own
# (docs/code-layout.md), declared as tests below.
sonar.sources=src,assets/viewer
sonar.sourceEncoding=UTF-8

# Clippy is run by the Sonar Rust analyzer itself (cargo and clippy are on the runner).
# Coverage: cargo llvm-cov writes LCOV here in the sonar job of .github/workflows/ci.yml.
sonar.rust.lcov.reportPaths=target/lcov.info
sonar.javascript.lcov.reportPaths=target/viewer-lcov.info

# src/redact.rs and its tests under src/redact/ carry made-up credentials as fixtures for the
# masking code; the secret
# detectors must not report them (GitGuardian's hits there are skipped the same way).
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e1.resourceKey=src/redact.rs
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e2.resourceKey=src/redact/**

# The Node harnesses and fixtures under src/testdata are tests. The agent plugin templates
# (src/*.js, src/*.ts) run under those harnesses from the Rust tests; LCOV only covers Rust,
# so they are left out of the coverage figure rather than counted as untested. The unit
# tests' own files and the other modules only test builds compile are tests too: a test
# (`a_test_module_is_a_file_of_its_own_and_declared_to_sonar`) fails when one is not named here.
sonar.exclusions=src/testdata/**,src/**/tests.rs,src/**/input_tests.rs,src/**/fixture.rs,src/**/fixture_scan.rs,src/**/stub.rs,src/crash.rs
sonar.tests=src
sonar.test.inclusions=src/testdata/**,src/**/tests.rs,src/**/input_tests.rs,src/**/fixture.rs,src/**/fixture_scan.rs,src/**/stub.rs,src/crash.rs
sonar.coverage.exclusions=src/*.js,src/*.ts
