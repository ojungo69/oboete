sonar.organization=ojungo69
sonar.projectKey=ojungo69_free-mem
sonar.sources=src,scripts
sonar.tests=test,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,**/*.test-support.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/dco-lcov.info
# The isolated-user harness and the recorded contract probes are driven against real agent CLIs on
# the dogfood account, not by unit tests, so their lines are excluded from the coverage metric
# rather than counted as untested. Their own unit tests still run in CI. The fixture generator and
# replay driver run by hand (T067/T068, output hash-pinned under test/fixtures), and pack-check's
# main() drives a real `npm pack` in the Pack check CI step; its pure helpers keep their unit test.
# src/launcher.mjs only ever runs as the dist/oboete.mjs copy of itself in a child process, so
# in-process V8 coverage cannot attribute a line back to it; test/unit/launcher.test.ts covers its
# behaviour through subprocesses instead. eslint.config.js names it so lint still applies.
sonar.coverage.exclusions=scripts/e2e/**,scripts/measure-*.mjs,scripts/build.mjs,scripts/fixtures/**,src/fixture/**,scripts/pack-check.mjs,src/launcher.mjs
# jssecurity:S8707 ("Path Traversal via faulty LLM-supplied CLI arguments") fires on every read of
# `--bundle` in scripts/measure-cold-start.mjs, which is a developer-run measurement script: the
# argument names the build to measure and the script spawns exactly that file thirty times per
# scenario, so reading its size is strictly less than what it is there to do. There is no untrusted
# caller and no privilege boundary. The finding was dispositioned by hand three times on this file
# in one afternoon -- each push moved the line and made a new issue key on both the pull request and
# the branch analysis -- which is a suppression maintained badly rather than an absent one. Scoped
# to this rule in this one file: any other rule here, and this rule anywhere else, still reports.
# Revisit if this script ever takes a path it writes to, rather than only ones it reads and spawns:
# every write and delete in it today builds its path from `tmpdir()`, never from an argument.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/measure-cold-start.mjs
# Ignore generated artifacts and the archived implementation.
sonar.exclusions=legacy/**,build/**,dist/**
sonar.sourceEncoding=UTF-8
# src/db/migrations/*.sql is SQLite; the PL/SQL analyser (Oracle syntax) does not apply to it. No other analyser claims .sql.
sonar.plsql.file.suffixes=pks,pkb
