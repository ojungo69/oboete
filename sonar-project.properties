sonar.organization=ojungo69
sonar.projectKey=ojungo69_oboete
sonar.projectName=oboete

# Rust with inline #[cfg(test)] modules, plus the bundled viewer page.
sonar.sources=src,assets/viewer
sonar.sourceEncoding=UTF-8

# Clippy is run by the Sonar Rust analyzer itself (cargo and clippy are on the runner).
# Coverage: cargo llvm-cov writes LCOV here in the sonar job of .github/workflows/ci.yml.
sonar.rust.lcov.reportPaths=target/lcov.info

# src/redact.rs carries made-up credentials as test fixtures for the masking code; the secret
# detectors must not report them (GitGuardian's hits there are skipped the same way).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.e1.resourceKey=src/redact.rs
