sonar.organization=ojungo69
sonar.projectKey=ojungo69_free-mem
# src/ is added by the first implementation pull request of oboete M1.
sonar.sources=scripts
sonar.tests=scripts
sonar.test.inclusions=**/*.test.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/dco-lcov.info
# The isolated-user harness and the recorded contract probes are driven against real agent CLIs on
# the dogfood account, not by unit tests, so their lines are excluded from the coverage metric
# rather than counted as untested. Their own unit tests still run in CI.
sonar.coverage.exclusions=scripts/e2e/**,scripts/measure-*.mjs,scripts/build.mjs
# Inert while sonar.sources is scripts/; becomes load-bearing when sources widen to the repository root.
sonar.exclusions=legacy/**
sonar.sourceEncoding=UTF-8
