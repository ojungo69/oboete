<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>oboete</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="top">
    <h1>oboete</h1>
    <span id="live" class="live" title="Checks for new memory every few seconds">Live</span>
    <button type="button" id="theme" class="quiet small" title="Follow the system, or force light or dark">Theme: auto</button>
  </div>
  <form id="controls" role="search">
    <label class="field">
      <span>Repository</span>
      <select id="repo"></select>
    </label>
    <label class="field grow">
      <span>Search</span>
      <input id="q" type="search" autocomplete="off" placeholder="Words from decisions, fixes, summaries">
    </label>
    <button type="submit">Search</button>
    <button type="button" id="refresh" class="quiet">Refresh</button>
  </form>
  <nav id="tabs" aria-label="Views">
    <button type="button" data-view="feed" class="tab">Feed</button>
    <button type="button" data-view="sessions" class="tab">Sessions</button>
    <button type="button" data-view="context" class="tab">Context</button>
    <button type="button" data-view="stats" class="tab">Stats</button>
  </nav>
</header>
<main>
  <p id="status" role="status" aria-live="polite"></p>
  <h2 id="heading">Feed</h2>
  <ol id="list" class="entries"></ol>
  <div id="panel"></div>
</main>
<noscript><p class="notice">The viewer needs JavaScript.</p></noscript>
</body>
</html>
