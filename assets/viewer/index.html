<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>oboete</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <h1>oboete</h1>
  <form id="controls" role="search">
    <label class="field">
      <span>Repository</span>
      <select id="repo"></select>
    </label>
    <label class="field grow">
      <span>Search</span>
      <input id="q" type="search" autocomplete="off" placeholder="Words from decisions, fixes, summaries">
    </label>
    <button type="submit">Search</button>
    <button type="button" id="refresh" class="quiet">Refresh</button>
  </form>
</header>
<main>
  <p id="status" role="status" aria-live="polite"></p>
  <h2 id="heading">Sessions</h2>
  <ol id="list" class="entries"></ol>
</main>
<noscript><p class="notice">The viewer needs JavaScript.</p></noscript>
</body>
</html>
