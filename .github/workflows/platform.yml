# T040 / SC-006: the engine gate on actual macOS (Apple Silicon). Linux is ci.yml's `engine` job and
# WSL is the developer host; this workflow is the macOS row, run on demand and by the pull request
# that changes it. It is not on every push: the timed hook tests carry 300 ms bounds that duplicate
# runs starve (issue #221), and one recorded run per engine change is what the check asks for.
# No agent CLI, model or account is used, so agent probes stay "unverified" on macOS.
name: Platform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/platform.yml"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "24.x"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Platform
        run: sw_vers && uname -m && node -v
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # The two legs of `npm test`, split so a failure in one still records the other; every step
      # after the build runs unless the job was cancelled, because a platform check wants each verdict.
      - name: Unit tests
        run: >-
          node --test --enable-source-maps --import ./build/test/helpers/compile-cache.mjs
          'build/test/unit/**/*.test.mjs' 'build/test/migrations/**/*.test.mjs' 'scripts/e2e/**/*.test.mjs'
          'scripts/dco-check.test.mjs' 'scripts/pack-check.test.mjs'
      - name: Serial end-to-end and fault tests
        if: ${{ !cancelled() }}
        run: >-
          node --test --enable-source-maps --import ./build/test/helpers/compile-cache.mjs --test-concurrency=1
          'build/test/e2e-*.test.mjs' 'build/test/fault-*.test.mjs' 'scripts/quality-debt-record*.test.mjs'
      - name: Pack check
        if: ${{ !cancelled() }}
        run: npm run pack-check
      - name: Hook cold start
        if: ${{ !cancelled() }}
        run: node scripts/measure-cold-start.mjs --bundle dist/oboete.mjs --markdown
      - name: Packed engine in an isolated home
        if: ${{ !cancelled() }}
        # A no-model setup must still open storage, full-text search and the schema on this platform.
        # Setup's own exit is not the verdict: with no agent installed it reports nothing to wire.
        run: |
          export HOME="$RUNNER_TEMP/home" OBOETE_HOME="$RUNNER_TEMP/home/.oboete"
          mkdir -p "$HOME"
          node dist/oboete.mjs --version
          node dist/oboete.mjs setup --provider none --yes || echo "setup exit $?"
          node dist/oboete.mjs doctor --json > "$RUNNER_TEMP/doctor.json" || echo "doctor exit $?"
          node -e '
            const items = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).items;
            const bad = ["storage", "fts", "migration", "worker", "spool"]
              .filter((name) => items.find((item) => item.item === name)?.status !== "healthy");
            for (const item of items) console.log(item.item, item.status);
            if (bad.length > 0) { console.error("not healthy:", bad.join(", ")); process.exit(1); }
          ' "$RUNNER_TEMP/doctor.json"
