name: OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to review
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    # Set the model last when configuring the provider; an unset model disables reviews.
    # Automatic reviews spend quota only on this repository's non-draft PRs.
    if: >-
      vars.OCR_LLM_MODEL != '' &&
      ((github.event_name == 'pull_request_target' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: open-code-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Check provider configuration
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
        run: |
          if [[ -z "$OCR_LLM_URL" || -z "$OCR_LLM_AUTH_TOKEN" ]]; then
            echo '::error::Configure OCR_LLM_URL and OCR_LLM_AUTH_TOKEN in repository Actions secrets. See docs/open-code-review.md.'
            exit 1
          fi

      - name: Resolve manually selected pull request
        if: github.event_name == 'workflow_dispatch'
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const number = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(number) || !Number.isSafeInteger(Number(number))) {
              throw new Error('pr_number must be a positive integer.');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(number),
            });
            if (pr.state !== 'open' || pr.draft) {
              throw new Error('Select an open, non-draft pull request.');
            }
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      # The action checks out the trusted event ref and reads PR blobs through git.
      # Do not add a checkout of the PR head or execute PR scripts in this job.
      - name: Review pull request
        uses: alibaba/open-code-review@486022daaf14f7142275eddb9b3cacc3cc5dadfa # 2026-09-24
        with:
          ocr_version: '1.12.9'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
          # The upstream default contains a provider-specific "thinking" field.
          llm_extra_body: '{}'
          language: Japanese
          review_concurrency: '2'
          max_tokens_budget: '100000'
          incremental: 'true'
          upload_artifacts: 'false'
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
