name: OpenCodeReview

on:
  # Not on each push: every run is paid, so a PR's last push is reviewed by hand with
  # workflow_dispatch (owner, 2026-09-29; docs/open-code-review.md).
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to review
        required: true
        type: string

# Mirror review.if: skipped events must not cancel an eligible review of the PR.
concurrency:
  group: >-
    ${{
      (vars.OCR_LLM_MODEL != '' &&
       ((github.event_name == 'pull_request_target' &&
         !github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))) &&
      format('open-code-review-pr-{0}', github.event.pull_request.number || inputs.pr_number) ||
      format('open-code-review-skip-{0}', github.run_id)
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Set the model last when configuring the provider; an unset model disables reviews.
    # Automatic reviews spend quota only on this repository's non-draft PRs.
    if: >-
      vars.OCR_LLM_MODEL != '' &&
      ((github.event_name == 'pull_request_target' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The CLI's first call starts a background `npm i -g` of the newest release, which replaced
      # the pinned version while the action was still calling it ("Cannot find module").
      OCR_NO_UPDATE: '1'
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: open-code-review
      cancel-in-progress: false
      queue: max
    steps:
      - name: Resolve queued pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const number = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(number) || !Number.isSafeInteger(Number(number))) {
              throw new Error('pr_number must be a positive integer.');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(number),
            });
            if (pr.state !== 'open' || pr.draft) {
              if (context.eventName === 'workflow_dispatch') {
                throw new Error('Select an open, non-draft pull request.');
              }
              core.notice('Skipping a pull request that closed or became a draft while queued.');
              core.setOutput('review', 'false');
              return;
            }
            // No push queues a review (a PR's last push is reviewed by hand), so an opening review
            // that waited in the queue past a push reviews the current head, as a manual one does.
            const eventPr = context.payload.pull_request;
            if (eventPr && (pr.head.sha !== eventPr.head.sha || pr.base.ref !== eventPr.base.ref)) {
              core.notice('The pull request moved while this review was queued: reviewing its current head.');
            }
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('review', 'true');

      - name: Check provider configuration
        if: steps.pr.outputs.review == 'true'
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_FALLBACK_URL: ${{ secrets.OCR_LLM_FALLBACK_URL }}
          OCR_LLM_FALLBACK_AUTH_TOKEN: ${{ secrets.OCR_LLM_FALLBACK_AUTH_TOKEN }}
          OCR_LLM_FALLBACK_MODEL: ${{ vars.OCR_LLM_FALLBACK_MODEL }}
        run: |
          if [[ -z "$OCR_LLM_URL" || -z "$OCR_LLM_AUTH_TOKEN" ]]; then
            echo '::error::Configure OCR_LLM_URL and OCR_LLM_AUTH_TOKEN in repository Actions secrets. See docs/open-code-review.md.'
            exit 1
          fi
          # The fallback has its own endpoint and key: its model names a model of that endpoint.
          if [[ -n "$OCR_LLM_FALLBACK_MODEL" && ( -z "$OCR_LLM_FALLBACK_URL" || -z "$OCR_LLM_FALLBACK_AUTH_TOKEN" ) ]]; then
            echo '::error::OCR_LLM_FALLBACK_MODEL needs OCR_LLM_FALLBACK_URL and OCR_LLM_FALLBACK_AUTH_TOKEN. See docs/open-code-review.md.'
            exit 1
          fi

      # The action checks out the trusted event ref and reads PR blobs through git.
      # Do not add a checkout of the PR head or execute PR scripts in this job.
      - name: Review with ${{ vars.OCR_LLM_MODEL }}
        id: primary
        if: steps.pr.outputs.review == 'true'
        continue-on-error: true
        uses: alibaba/open-code-review@486022daaf14f7142275eddb9b3cacc3cc5dadfa # 2026-09-24
        with:
          ocr_version: '1.12.9'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
          # The upstream default contains a provider-specific "thinking" field. The variable pins
          # OpenRouter to the owner's DeepSeek key (docs/open-code-review.md).
          llm_extra_body: ${{ vars.OCR_LLM_EXTRA_BODY || '{}' }}
          llm_reasoning_effort: high
          llm_timeout: '600'
          review_task_timeout: '15'
          effort: high
          language: Japanese
          review_concurrency: '1'
          max_tokens_budget: '6000000'
          # Line overlap alone does not prove two findings describe the same problem.
          incremental: 'false'
          upload_artifacts: 'false'
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}

      # A nonzero OCR exit happens before comments are posted. Setup and posting
      # failures must remain failures, without spending another model's quota.
      - name: Fall back to ${{ vars.OCR_LLM_FALLBACK_MODEL }}
        id: fallback
        if: >-
          !cancelled() && steps.primary.outcome == 'failure' &&
          env.OCR_EXIT_CODE != '' && env.OCR_EXIT_CODE != '0' &&
          vars.OCR_LLM_FALLBACK_MODEL != '' &&
          vars.OCR_LLM_FALLBACK_MODEL != vars.OCR_LLM_MODEL
        uses: alibaba/open-code-review@486022daaf14f7142275eddb9b3cacc3cc5dadfa # 2026-09-24
        with:
          ocr_version: '1.12.9'
          llm_url: ${{ secrets.OCR_LLM_FALLBACK_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_FALLBACK_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_FALLBACK_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}
          llm_extra_body: '{}'
          llm_reasoning_effort: high
          llm_timeout: '600'
          review_task_timeout: '15'
          effort: high
          language: Japanese
          review_concurrency: '1'
          max_tokens_budget: '6000000'
          incremental: 'false'
          upload_artifacts: 'false'
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}

      - name: Fail when no review attempt succeeded
        if: >-
          !cancelled() && steps.primary.outcome == 'failure' &&
          steps.fallback.outcome != 'success'
        run: |
          echo '::error::The primary review failed and no fallback review succeeded. See the failed step above.'
          exit 1
