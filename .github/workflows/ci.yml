name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: DCO gate self-test
        # ゲート本体（dco.yml）は base branch 側の checker を走らせるので、PR 側の変更は
        # そこには載らない。checker を直す PR の正しさはこの job で担保する。
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/dco-lcov.info \
            scripts/dco-check.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Engine coverage
        # package.json test:coverage enables --experimental-test-coverage but has no lcov reporter.
        # The scripts/e2e harness tests belong in this step: sonar.sources is scripts/, and Sonar
        # charges lines_to_cover for every source file whether or not the lcov report names it
        # (measured 2026-09-04: probe-lib/agents.mjs at 0% / 404 uncovered with no lcov entry at
        # all), so running them uninstrumented would report 0%, not exclude them.
        run: |
          npm run build
          mkdir -p coverage
          node --test --enable-source-maps --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            'build/test/unit/**/*.test.mjs' 'build/test/migrations/**/*.test.mjs' 'scripts/e2e/**/*.test.mjs'
      - name: End-to-end bundle tests
        # The hook tests time the real bundle against its 300 ms deadline, so they run alone and
        # without coverage instrumentation, the way `npm test` runs them.
        run: node --test --enable-source-maps --test-concurrency=1 'build/test/e2e-*.test.mjs'
      - name: Analyze with SonarQube Cloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "24.x"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit for secrets
        # gitleaks-action は `pulls/:n/commits` を pagination なしで呼び、返ってきた 1 ページ
        # （既定 30 件）の先頭と末尾を走査範囲にする。commit が 30 を超える PR では新しい側が
        # 丸ごと範囲外になる。範囲の選び方を持ち込まず、clone にある commit を全部走査する
        env:
          GITLEAKS_VERSION: "8.30.1"
          # gitleaks_8.30.1_checksums.txt の linux_x64 の値
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL --retry 3 --max-time 60 --retry-max-time 180 -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
          "${RUNNER_TEMP}/gitleaks" detect --no-banner --redact --exit-code 1 \
            --source . --config .gitleaks.toml
