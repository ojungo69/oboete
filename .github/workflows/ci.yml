name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A push to a pull request ends the run of the push before it. A run on main is never ended.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Linux: the format, the lints and the tests, once for each build, side by side. The local
  # model's code (milestone 4, Task 10) is the `local-embed` build: its tests run on stubs, so
  # wherever it builds.
  linux:
    name: linux (${{ matrix.build.name }})
    strategy:
      fail-fast: false
      matrix:
        build:
          - { name: default, flags: "" }
          - { name: local-embed, flags: "--features local-embed" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.build.name }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets ${{ matrix.build.flags }} -- -D warnings
      - run: cargo test --locked ${{ matrix.build.flags }}
  # The name the ruleset requires: it passes when both Linux builds passed.
  check:
    needs: linux
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.linux.result }}" = success
  # The other two platforms the owner uses (milestone 2 plan, "After the tasks"), each build side
  # by side. Windows builds with MSVC here, the release toolchain the WSL cross-build does not
  # cover. The lints run here too: code that only these platforms compile is seen by no other run.
  os:
    name: ${{ matrix.os }} (${{ matrix.build.name }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        build:
          - { name: default, flags: "" }
          - { name: local-embed, flags: "--features local-embed" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.build.name }}
      - run: cargo clippy --locked --all-targets ${{ matrix.build.flags }} -- -D warnings
      - run: cargo test --locked ${{ matrix.build.flags }}
  # The names the ruleset requires: each passes when every build on both platforms passed.
  test-os:
    name: test-os (${{ matrix.os }})
    needs: os
    if: always()
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.os.result }}" = success
  # Cargo.toml's rust-version is a promise to whoever builds from source: both builds compile
  # with that toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets
      - run: cargo check --locked --all-targets --features local-embed
  # SonarQube Cloud: Rust is not covered by its automatic analysis, so the scanner runs here.
  # Forks and Dependabot get no SONAR_TOKEN, so their pull requests skip this job.
  sonar:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      # Both builds, as the linux job tests them (the local model's code runs only with its
      # feature), merged as cargo-llvm-cov's README shows.
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --no-report
      - run: cargo llvm-cov --no-report --features local-embed
      # A test that kills a child can leave its profile half written; the rest still merge.
      - run: cargo llvm-cov report --lcov --failure-mode all --output-path target/lcov.info
      - run: >-
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=target/viewer-lcov.info
          src/testdata/viewer-readiness/test.mjs
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
