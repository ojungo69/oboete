name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The local model's code (milestone 4, Task 10): its tests run on stubs, so wherever it builds.
      - run: cargo clippy --all-targets --features local-embed -- -D warnings
      - run: cargo test --features local-embed
  # The tests on the other two platforms the owner uses (milestone 2 plan, "After the tasks").
  # Windows builds with MSVC here, the release toolchain the WSL cross-build does not cover.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test
      # A hook test leaves the worker it starts idling for its minute (tests/hook_output.rs), and
      # Windows cannot replace a running exe: the next step's link of oboete.exe fails while it
      # waits. No test runs between the steps, so what is left is ended.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # One that ends by itself meanwhile throws on Kill: nothing is left to end then.
          Get-Process -Name oboete -ErrorAction SilentlyContinue | ForEach-Object {
            try { $_.Kill(); $_.WaitForExit(30000) | Out-Null } catch {}
          }
          # One still running would hold the exe the next build links: the step says so instead.
          if (Get-Process -Name oboete -ErrorAction SilentlyContinue) { throw "an oboete process is still running" }
      - run: cargo test --features local-embed
  # SonarQube Cloud: Rust is not covered by its automatic analysis, so the scanner runs here.
  # Forks and Dependabot get no SONAR_TOKEN, so their pull requests skip this job.
  sonar:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      # Both builds, as the check job tests them (the local model's code runs only with its
      # feature), merged as cargo-llvm-cov's README shows.
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --no-report
      - run: cargo llvm-cov --no-report --features local-embed
      # A test that kills a child can leave its profile half written; the rest still merge.
      - run: cargo llvm-cov report --lcov --failure-mode all --output-path target/lcov.info
      - run: >-
          node --test --experimental-test-coverage
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=target/viewer-lcov.info
          src/testdata/viewer-readiness/test.mjs
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
